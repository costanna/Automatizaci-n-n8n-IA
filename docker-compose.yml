services:
  tienda:
    build: .
    ports:
      - "8000:8000"
    environment:
      - TZ=Europe/Madrid
      - DB_PATH=/data/tienda.db
      - API_KEY=${API_KEY}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - SEED=${SEED:-1}
    volumes:
      - tienda_data:/data

  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - TZ=Europe/Madrid
      - GENERIC_TIMEZONE=Europe/Madrid
      # n8n 2.x solo deja leer ficheros de estas carpetas (separadas por ';'):
      # /datos (los CSV de data/) y ~/.n8n-files (historicos que escriben los flujos).
      - N8N_RESTRICT_FILE_ACCESS_TO=/datos;/home/node/.n8n-files
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_files:/home/node/.n8n-files
      # Los CSV de data/ (el Excel de Marisa) se leen desde n8n para la migracion.
      - ./data:/datos:ro

volumes:
  tienda_data:
  n8n_data:
  n8n_files:
